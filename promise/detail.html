<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>고양이 상세 정보</title>
    <style>
      .container {
        width: 800px;
        margin: 50px auto;
      }

      img {
        width: 100%;
        max-width: 500px;
        border-radius: 10px;
        display: block;
        margin-bottom: 20px;
      }

      .info {
        margin-top: 20px;
      }

      .info p {
        margin: 10px 0;
      }

      a {
        color: #0066cc;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="detail"></div>

    <script>
      // 1. URL 파라미터에서 id 추출하기 (?id=1 형태)
      const params = new URLSearchParams(location.search);
      const id = Number(params.get("id"));
      console.log("현재 페이지 고양이 ID:", id);

      async function getDetail() {
        try {
          // 2. 고양이 데이터 가져오기
          const res = await fetch("cats.json");
          const cats = await res.json();

          const detail = document.querySelector("#detail");

          // 3. 파라미터로 받아온 id랑 json에 있는 id랑 같은 요소를 찾는다.
          const cat = cats.find((item) => item.id === id);
          // console.log(cat);

          // 4. [예외 처리] 존재하지 않는 id거나 받아온 id가 없을 경우
          if (!cat) {
            detail.innerHTML = `
              <h2>고양이 정보를 찾을 수 없습니다.</h2>
              <p><a href="index.html">고양이 목록으로 돌아가기</a></p>
            `;
            return; // ★ 중요! 여기서 함수를 끝내서 밑에 코드가 실행 안 되게 막아줌 (에러 방지)
          }

          // 5. 데이터를 성공적으로 찾았을 때만 화면에 출력
          detail.innerHTML = `
            <div class="container">
              <img src="${cat.image}" alt="${cat.name}">
              <div class="info">
                  <h1>${cat.name}</h1>
                  <p><strong>원산지 :</strong> ${cat.origin}</p>
                  <p><strong>성격 :</strong> ${cat.temperament}</p>
                  <p><strong>수명 :</strong> ${cat.life_span}</p>
                  <p><strong>지능 :</strong> ⭐ ${cat.intelligence}</p>
                  <p><strong>친화력 :</strong> 💖 ${cat.affection_level}</p>
                  <p><strong>설명 :</strong></p>
                  <p>${cat.description}</p>
              </div>
              <p style="margin-top: 30px;">
                  <a href="index.html">← 목록으로 돌아가기</a>
              </p>
            </div>
          `;
        } catch (e) {
          console.error("데이터를 불러오는 중 에러 발생:", e);
        }
      }

      // 함수 실행
      getDetail();
    </script>
  </body>
</html>
